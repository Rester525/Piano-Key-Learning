<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Key Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="public/assets/img/icon-192.svg">
<link rel="icon" type="image/svg+xml" sizes="192x192" href="public/assets/img/icon-192.svg">
<link rel="icon" type="image/svg+xml" sizes="512x512" href="public/assets/img/icon-512.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">🎹 Settings</span>
      <button class="sidebar-close" id="sidebarClose" title="Close sidebar" aria-label="Close sidebar">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>
      </button>
    </div>

    <fieldset class="sidebar-section">
      <legend>Training Mode</legend>
      <label class="sidebar-radio">
        <input type="radio" name="trainingMode" value="noteReading" checked>
        Note Reading
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="trainingMode" value="earTraining">
        Ear Training
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="trainingMode" value="intervals">
        Intervals
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="trainingMode" value="chords">
        Chords
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="trainingMode" value="speedRun">
        Speed Run
      </label>
    </fieldset>

    <fieldset class="sidebar-section">
      <legend>Note Type</legend>
      <label class="sidebar-radio">
        <input type="radio" name="noteType" value="whole" checked>
        Whole
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="noteType" value="sharps">
        ♯ Sharps
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="noteType" value="flats">
        ♭ Flats
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="noteType" value="all">
        All
      </label>
    </fieldset>

    <fieldset class="sidebar-section">
      <legend>Instrument</legend>
      <label class="sidebar-radio">
        <input type="radio" name="instrument" value="sine" checked>
        Sine
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="instrument" value="piano">
        Piano
      </label>
      <label class="sidebar-radio">
        <input type="radio" name="instrument" value="guitar">
        Guitar
      </label>
    </fieldset>

    <button class="sidebar-toggle-theme" id="themeToggle" title="Toggle dark/light mode">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </aside>

  <!-- ═══════════ MAIN CONTENT ═══════════ -->
  <main class="main-content">

    <h1 class="app-title">Piano Key Learning</h1>
    <p class="subtitle">Tap the correct key on the piano</p>

    <!-- Score Card -->
    <div class="top-bar">
      <div class="score-card">
        <div class="score-stat">
          <div class="score-num score-color" id="scoreNum">0</div>
          <div class="score-label">Score</div>
        </div>
        <div class="score-stat">
          <div class="score-num streak-color" id="streakNum">0</div>
          <div class="score-label">Streak</div>
        </div>
        <div class="score-stat" id="speedRunTimerStat" style="display:none;">
          <div class="score-num" id="speedRunTimer" style="color: var(--red);">60</div>
          <div class="score-label">Time</div>
        </div>
        <div class="medal-display">
          <span class="medal-icon" id="medalIcon">🎹</span>
          <span class="medal-name" id="medalName">Beginner</span>
        </div>
      </div>
    </div>

    <!-- Question -->
    <div class="question-area">
      <div class="prompt" id="promptText">Tap the key …</div>
      <div class="question-note" id="questionNote">?</div>
      <button class="play-again-btn" id="playAgainBtn" style="display:none">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,3 14,8 2,13"/><rect x="1" y="2" width="2" height="12" rx="0.5" fill="currentColor" stroke="none"/></svg>
        Play Again
      </button>
      <div class="feedback-msg" id="feedbackMsg"></div>
    </div>

    <!-- Chord Quality Buttons -->
    <div class="chord-btn-row" id="chordBtnRow" style="display:none">
      <button class="chord-btn" data-quality="major">Major</button>
      <button class="chord-btn" data-quality="minor">Minor</button>
      <button class="chord-btn" data-quality="diminished">Dim</button>
      <button class="chord-btn" data-quality="augmented">Aug</button>
      <button class="chord-btn" data-quality="dom7">Dom 7</button>
      <button class="chord-btn" data-quality="maj7">Maj 7</button>
    </div>

    <!-- Piano Keyboard -->
    <div class="keyboard-wrap">
      <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Streak Progress -->
    <div class="streak-bar">
      Next medal at <span id="nextMedalNum">10</span> streak
      <div class="streak-track" id="streakDots"></div>
    </div>

  </main>

  <!-- Sidebar Toggle -->
  <button class="sidebar-toggle" id="sidebarToggle" title="Open sidebar" aria-label="Open sidebar">
    <span class="hamburger-lines">
      <span></span><span></span><span></span>
    </span>
  </button>

</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
