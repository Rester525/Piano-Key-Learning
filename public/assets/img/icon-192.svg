<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#11161e"/>
    </linearGradient>
    <linearGradient id="key-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf8"/>
      <stop offset="100%" stop-color="#e3dcc8"/>
    </linearGradient>
    <linearGradient id="key-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6af7"/>
      <stop offset="100%" stop-color="#f0c840"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="24" fill="url(#bg)"/>
  <!-- Piano keyboard -->
  <g transform="translate(24, 56)">
    <!-- White keys -->
    <rect x="0" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <rect x="20" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <rect x="40" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <rect x="60" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <rect x="80" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <rect x="100" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <rect x="120" y="0" width="18" height="80" rx="0 0 3 3" fill="url(#key-white)" stroke="#bfb8a0" stroke-width="1"/>
    <!-- Black keys -->
    <rect x="14" y="0" width="12" height="48" rx="0 0 2 2" fill="url(#key-black)"/>
    <rect x="34" y="0" width="12" height="48" rx="0 0 2 2" fill="url(#key-black)"/>
    <rect x="74" y="0" width="12" height="48" rx="0 0 2 2" fill="url(#key-black)"/>
    <rect x="94" y="0" width="12" height="48" rx="0 0 2 2" fill="url(#key-black)"/>
    <rect x="114" y="0" width="12" height="48" rx="0 0 2 2" fill="url(#key-black)"/>
  </g>
  <!-- Accent glow -->
  <circle cx="160" cy="32" r="24" fill="url(#accent)" opacity="0.15"/>
</svg>